<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion Store</title>

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #fafafa;
      color: #333;
    }

    header {
      background: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1521334884684-d80222895322') center/cover;
      color: white;
    }

    .hero h1 {
      font-size: 42px;
    }

    .products {
      padding: 40px 20px;
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .product h3 {
      margin: 15px 0 5px;
    }

    .price {
      color: #e91e63;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 20px;
    }

    footer {
      background: #111;
      color: #ccc;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h2>🖤 Fashion Store</h2>
</header>

<section class="hero">
  <h1>แฟชั่นใหม่ล่าสุด</h1>
  <p>สวย เรียบ หรู ในราคาจับต้องได้</p>
</section>

<section class="products">
  <div class="product">
    <img src="https://images.unsplash.com/photo-1520975922371-a67f27f6c1ec" />
    <h3>เดรสสีดำ</h3>
    <div class="price">฿790</div>
    <a class="btn" href="https://line.me/ti/p/YOURLINE">สั่งซื้อ</a>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb" />
    <h3>เสื้อแฟชั่น</h3>
    <div class="price">฿590</div>
    <a class="btn" href="https://line.me/ti/p/YOURLINE">สั่งซื้อ</a>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" />
    <h3>เสื้อยืด</h3>
    <div class="price">฿390</div>
    <a class="btn" href="https://line.me/ti/p/YOURLINE">สั่งซื้อ</a>
  </div>
</section>

<footer>
  <p>ติดต่อเรา | LINE : @yourline | IG : yourig</p>
</footer>

</body>
</html>
