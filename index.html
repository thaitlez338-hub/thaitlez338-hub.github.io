<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ร้านขายเครื่องดนตรี</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
    }
    header {
      background: #111827;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    nav {
      background: #1f2933;
      padding: 0.8rem;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .product {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }
    .product h3 {
      margin: 15px 0 5px;
    }
    .price {
      color: #dc2626;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    footer {
      background: #e5e7eb;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🎸 ร้านขายเครื่องดนตรี</h1>
  <p>เบส | กีตาร์ | แอมป์ คุณภาพ</p>
</header>

<nav>
  <a href="#">หน้าแรก</a>
  <a href="#">กีตาร์</a>
  <a href="#">เบส</a>
  <a href="#">แอมป์</a>
  <a href="#">ติดต่อเรา</a>
</nav>

<div class="container">
  <div class="product">
    <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1" alt="Guitar" />
    <h3>กีตาร์ไฟฟ้า</h3>
    <p class="price">฿12,900</p>
    <button onclick="buy('กีตาร์ไฟฟ้า')">สั่งซื้อ</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d" alt="Bass" />
    <h3>เบสไฟฟ้า</h3>
    <p class="price">฿14,500</p>
    <button onclick="buy('เบสไฟฟ้า')">สั่งซื้อ</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1520523839897-bd0b52f945a0" alt="Amp" />
    <h3>แอมป์กีตาร์</h3>
    <p class="price">฿8,900</p>
    <button onclick="buy('แอมป์กีตาร์')">สั่งซื้อ</button>
  </div>
</div>

<footer>
  <p>📞 ติดต่อ: 08x-xxx-xxxx | LINE: @musicshop</p>
  <p>© 2026 ร้านขายเครื่องดนตรี</p>
</footer>

<script>
  function buy(product) {
    alert('คุณเลือกซื้อ: ' + product);
  }
</script>

</body>
</html>
